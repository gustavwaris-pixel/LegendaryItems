name: LegendaryItems
version: 1.0.0
main: ru.legendary.LegendaryPlugin
api-version: '1.21'
author: Legendary
description: Система легендарных предметов

commands:
  leg:
    description: Выдать обычную легендарку
    usage: /leg <id|list> [player]
    permission: legendary.use.leg
  minileg:
    description: Выдать маленькую вещь
    usage: /minileg <id|list> [player]
    permission: legendary.use.minileg
  legr:
    description: Выдать пробуждённую легендарку
    usage: /legr <id|list> [player]
    permission: legendary.use.legr

permissions:
  legendary.admin:
    description: Полный доступ ко всем командам
    default: op
    children:
      legendary.use.leg: true
      legendary.use.minileg: true
      legendary.use.legr: true
  legendary.use.leg:
    description: Доступ к /leg
    default: op
  legendary.use.minileg:
    description: Доступ к /minileg
    default: op
  legendary.use.legr:
    description: Доступ к /legr
    default: op
